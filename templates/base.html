<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Despacho Rápido{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topo">
    <a class="marca" href="{{ url_for('fila') }}">🚚 Despacho Rápido</a>
    <nav>
      <a href="{{ url_for('fila') }}" class="{{ 'ativo' if request.endpoint == 'fila' }}">Fila de faturamento</a>
      <a href="{{ url_for('rastreio') }}" class="{{ 'ativo' if request.endpoint == 'rastreio' }}">Rastreio</a>
    </nav>
  </header>
  <main>{% block conteudo %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
